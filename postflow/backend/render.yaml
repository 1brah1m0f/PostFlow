services:
  - type: web
    name: postflow-backend
    runtime: python
    pythonVersion: "3.12"
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: ./uploads
      - key: PYTHON_VERSION
        value: "3.12.0"
